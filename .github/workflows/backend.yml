name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ocp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ocp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ocp -d ocp"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      OCP_DEBUG: '1'
      OCP_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://ocp:ci-only-password@localhost:5432/ocp' || 'sqlite:///db.sqlite3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test tests --noinput
      - run: OCP_MANIFEST_STATIC=1 python manage.py collectstatic --noinput
      - run: docker build -t ocp-ci .
