name: open-conference-platform
x-app: &app
  build: .
  image: open-conference-platform:local
  env_file: .env.production
  environment:
    DJANGO_SETTINGS_MODULE: ocp.settings.production
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ocp
      POSTGRES_USER: ocp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Compose env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocp -d ocp"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
  worker:
    <<: *app
    command: ["python", "manage.py", "process_outbox", "--loop"]
  release:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    profiles: ["release"]
    restart: "no"
volumes:
  postgres_data:
